<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Dasturlash Tili - Interaktiv Kurs</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background-color: #0b0f19;
            padding: 20px;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h2 {
            color: var(--accent);
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .module-btn:hover, .module-btn.active {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border-color: var(--accent);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            max-width: 900px;
        }

        .lesson-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        pre {
            background-color: #090d16;
            padding: 18px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 15px;
        }

        /* Quiz Box */
        .quiz-container {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #475569;
            margin-top: 25px;
        }

        .quiz-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover {
            background-color: #334155;
        }

        .result-msg {
            margin-top: 12px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚡ C Trainer</h2>
        <button class="module-btn active" onclick="loadLesson(0)">1. Kirish & Birinchi Kod</button>
        <button class="module-btn" onclick="loadLesson(1)">2. O'zgaruvchilar (Variables)</button>
        <button class="module-btn" onclick="loadLesson(2)">3. Shartlar (If / Else)</button>
        <button class="module-btn" onclick="loadLesson(3)">4. Tsikllar (For / While)</button>
        <button class="module-btn" onclick="loadLesson(4)">5. Massivlar (Arrays)</button>
        <button class="module-btn" onclick="loadLesson(5)">6. Ko'rsatkichlar (Pointers)</button>
    </div>

    <div class="main-content">
        <div class="lesson-card">
            <h1 id="lessonTitle">Yuklanmoqda...</h1>
            <p id="lessonText"></p>
            
            <h3>📋 Kod Namunasi:</h3>
            <pre><code id="codeExample"></code></pre>

            <div class="quiz-container">
                <div class="quiz-title" id="quizQuestion">Topshiriq yuklanmoqda...</div>
                <div id="quizOptions"></div>
                <div id="resultMsg" class="result-msg"></div>
            </div>
        </div>
    </div>

    <script>
        const lessons = [
            {
                title: "1. Kirish & Birinchi Kod",
                text: "C dasturlash tili barcha zamonaviy tillarning otasi hisoblanadi. Dastur doimo 'main()' funksiyasidan boshlanadi. Ekranga matn chiqarish uchun 'printf()' buyrug'i ishlatiladi.",
                code: `#include <stdio.h>\n\nint main() {\n    printf("Salom, Dunyo!\\n");\n    return 0;\n}`,
                question: "Ekranga matn chiqarish uchun qaysi funksiya ishlatiladi?",
                options: ["cin >>", "printf()", "Console.WriteLine()", "print()"],
                correct: 1
            },
            {
                title: "2. O'zgaruvchilar (Variables)",
                text: "C tilida har bir o'zgaruvchining turi aniq ko'rsatilishi kerak: 'int' (butun son), 'float' (o'nlik son), 'char' (belgi).",
                code: `#include <stdio.h>\n\nint main() {\n    int yosh = 20;\n    float narx = 15.5;\n    char daraja = 'A';\n    printf("Yosh: %d", yosh);\n    return 0;\n}`,
                question: "C tilida 'int' qanday turdagi ma'lumotni saqlaydi?",
                options: ["Matnlar", "O'nlik kasr sonlar", "Butun sonlar", "Mantiqiy qiymat"],
                correct: 2
            },
            {
                title: "3. Shart Operatorlari (If / Else)",
                text: "Kodingiz ma'lum bir shartga qarab har xil yo'ldan ketishini ta'minlaydi.",
                code: `#include <stdio.h>\n\nint main() {\n    int ball = 85;\n    if (ball >= 60) {\n        printf("O'tdingiz!\\n");\n    } else {\n        printf("Yiqildingiz!\\n");\n    }\n    return 0;\n}`,
                question: "Agar 'ball = 50' bo'lsa, yuqoridagi kod nima chiqaradi?",
                options: ["O'tdingiz!", "Yiqildingiz!", "Hech narsa", "Xatolik beradi"],
                correct: 1
            },
            {
                title: "4. Tsikllar (For / While)",
                text: "Bir xil kodni bir necha marta takrorlash uchun ishlatiladi.",
                code: `#include <stdio.h>\n\nint main() {\n    for(int i = 1; i <= 5; i++) {\n        printf("Sanoq: %d\\n", i);\n    }\n    return 0;\n}`,
                question: "Yuqoridagi 'for' tsikli necha marta takrorlanadi?",
                options: ["4 marta", "5 marta", "6 marta", "Cheksiz"],
                correct: 1
            },
            {
                title: "5. Massivlar (Arrays)",
                text: "Bir nechta bir xil turdagi qiymatlarni bitta o'zgaruvchida ketma-ket saqlash imkonini beradi.",
                code: `#include <stdio.h>\n\nint main() {\n    int sonlar[3] = {10, 20, 30};\n    printf("Birinchi element: %d", sonlar[0]);\n    return 0;\n}`,
                question: "Massivning birinchi elementi indeksi nechidan boshlanadi?",
                options: ["1", "0", "-1", "i"],
                correct: 1
            },
            {
                title: "6. Ko'rsatkichlar (Pointers)",
                text: "Pointer — kompyuter xotirasidagi o'zgaruvchining aniq manzilini (address) saqlaydigan maxsus o'zgaruvchidir.",
                code: `#include <stdio.h>\n\nint main() {\n    int x = 10;\n    int *ptr = &x;\n    printf("Xotira manzili: %p", ptr);\n    return 0;\n}`,
                question: "O'zgaruvchining xotiradagi manzilini olish uchun qaysi belgi ishlatiladi?",
                options: ["*", "&", "%", "#"],
                correct: 1
            }
        ];

        let currentIdx = 0;

        function loadLesson(index) {
            currentIdx = index;
            const lesson = lessons[index];
            
            // Sidebar buttons update
            const btns = document.querySelectorAll('.module-btn');
            btns.forEach((btn, i) => {
                if(i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Content update
            document.getElementById('lessonTitle').innerText = lesson.title;
            document.getElementById('lessonText').innerText = lesson.text;
            document.getElementById('codeExample').innerText = lesson.code;
            document.getElementById('quizQuestion').innerText = "❓ Test: " + lesson.question;

            // Quiz options
            const optionsBox = document.getElementById('quizOptions');
            optionsBox.innerHTML = '';
            
            lesson.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerText = opt;
                b.onclick = () => checkAnswer(i);
                optionsBox.appendChild(b);
            });

            const res = document.getElementById('resultMsg');
            res.style.display = 'none';
        }

        function checkAnswer(chosen) {
            const lesson = lessons[currentIdx];
            const res = document.getElementById('resultMsg');
            res.style.display = 'block';

            if(chosen === lesson.correct) {
                res.style.backgroundColor = 'rgba(34, 197, 94, 0.2)';
                res.style.color = '#22c55e';
                res.innerText = "✅ Barakalla! To'g'ri javob.";
            } else {
                res.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                res.style.color = '#ef4444';
                res.innerText = "❌ Noto'g'ri, qaytadan urinib ko'ring!";
            }
        }

        // Birinchi darsni yuklash
        loadLesson(0);
    </script>
</body>
</html>
