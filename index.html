<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Multi-AI Chat Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        select { background: #eef2f7; font-weight: bold; cursor: pointer; }
        .chat-box { height: 350px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .ai { background: #e9ecef; color: #333; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; }
        .input-area button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .input-area button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🤖 Multi-AI Yordamchi Tizim</h2>
    
    <!-- AI Tanlash Bo'limi -->
    <div class="controls">
        <label for="aiModel" style="align-self:center; font-weight:bold;">AI Model:</label>
        <select id="aiModel">
            <option value="gemini">Google Gemini (Tavsiya etiladi)</option>
            <option value="groq">Groq / Llama 3 (Juda Tezkor)</option>
            <option value="pollinations">Pollinations AI (Kalitsiz & Tekin)</option>
        </select>
    </div>

    <!-- Chat Oynasi -->
    <div class="chat-box" id="chatBox">
        <div class="msg ai">Salom! O'zingizga ma'qul AI modelini tanlang va savolingizni bering.</div>
    </div>

    <!-- Savol Yuborish Formasi -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Savolingizni yozing..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button onclick="sendQuery()">Yuborish</button>
    </div>
</div>

<script>
// API Kalitlar (Kerakli joyga o'z kalitlaringizni kiriting)
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; // Google AI Studio'dan olinadi
const GROQ_API_KEY = "YOUR_GROQ_API_KEY";     // console.groq.com'dan olinadi (bepul)

async function sendQuery() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const selectedAI = document.getElementById('aiModel').value;
    const chatBox = document.getElementById('chatBox');

    // Foydalanuvchi xabari
    appendMessage(text, 'user');
    input.value = '';

    // Yuklanish holati
    const loadingMsg = appendMessage(`⏳ ${selectedAI.toUpperCase()} javob tayyorlamoqda...`, 'ai');

    let responseText = "";

    try {
        if (selectedAI === "gemini") {
            responseText = await fetchGemini(text);
        } else if (selectedAI === "groq") {
            responseText = await fetchGroq(text);
        } else if (selectedAI === "pollinations") {
            responseText = await fetchPollinations(text);
        }
    } catch (err) {
        responseText = "❌ Ulanishda xatolik yuz berdi. Iltimos, boshqa AI modelini tanlab ko'ring.";
    }

    // Yuklanish matnini javobga almashtirish
    loadingMsg.innerText = responseText;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

// 1. Google Gemini API
async function fetchGemini(prompt) {
    if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY") {
        return "⚠️ Gemini API kaliti kiritilmagan.";
    }
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Javob olib bo'lmadi.";
}

// 2. Groq (Meta Llama 3) API
async function fetchGroq(prompt) {
    if (!GROQ_API_KEY || GROQ_API_KEY === "YOUR_GROQ_API_KEY") {
        return "⚠️ Groq API kaliti kiritilmagan.";
    }
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            messages: [{ role: "user", content: prompt }],
            model: "llama3-8b-8192"
        })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || "Javob olib bo'lmadi.";
}

// 3. Pollinations AI API (API Key talab qilmaydi)
async function fetchPollinations(prompt) {
    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
    return await res.text();
}
</script>

</body>
</html>
