

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>C Dasturlash - Groq AI Instructor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .instructor-card { width: 100%; max-width: 650px; background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #313244; padding-bottom: 12px; margin-bottom: 15px; }
        .header h3 { margin: 0; color: #89b4fa; }
        .badge { background: #a6e3a1; color: #11111b; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
        .chat-box { height: 380px; overflow-y: auto; border: 1px solid #313244; background: #11111b; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
        .user { background: #89b4fa; color: #11111b; align-self: flex-end; max-width: 80%; }
        .instructor { background: #313244; color: #cdd6f4; align-self: flex-start; max-width: 90%; border-left: 3px solid #89b4fa; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        textarea { flex: 1; background: #11111b; border: 1px solid #313244; color: #cdd6f4; border-radius: 8px; padding: 10px; height: 50px; resize: none; font-family: inherit; }
        textarea:focus { outline: 1px solid #89b4fa; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b4befe; }
    </style>
</head>
<body>

<div class="instructor-card">
    <div class="header">
        <h3>👨‍🏫 C Dasturlash AI Instruktori</h3>
        <span class="badge">Groq (Llama 3) Online</span>
    </div>

    <!-- Chat oynasi -->
    <div class="chat-box" id="chatBox">
        <div class="msg instructor">Salom! Men sizning C dasturlash tili bo'yicha shaxsiy AI instruktoringizman. 

C kodingizni tashlang, xatolarini topib beraman yoki istalgan mavzuingizni tushuntiraman!</div>
    </div>

    <!-- Savol/Kod yuborish -->
    <div class="input-area">
        <textarea id="userInput" placeholder="C kodingizni yoki savolingizni bering..."></textarea>
        <button onclick="askInstructor()">Yuborish</button>
    </div>
</div>

<script>
// Groq API Kalitini shu yerga qo'yasiz (console.groq.com dan bepul olinadi)
const GROQ_API_KEY = "YOUR_GROQ_API_KEY";

async function askInstructor() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    input.value = '';

    const loadingMsg = appendMessage("⚡ Groq kodni tahlil qilmoqda...", 'instructor');

    try {
        if (!GROQ_API_KEY || GROQ_API_KEY === "YOUR_GROQ_API_KEY") {
            loadingMsg.innerText = "⚠️ Groq API kaliti kiritilmagan. Lutfan, GROQ_API_KEY o'zgaruvchisiga kalitingizni kiriting.";
            return;
        }

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${GROQ_API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: [
                    {
                        role: "system",
                        content: `Siz C dasturlash tili bo'yicha tajribali AI instruktorsiz. 
Vazifangiz:
1. Foydalanuvchining C kodidagi xatolarni (syntax, logic, memory leak, pointer xatolari) topish va to'g'rilash.
2. Tushuntirishlarni o'zbek tilida, soddalashtirilgan va aniq berish.
3. Koddagi muhim joylarni ajratib ko'rsatish.`
                    },
                    {
                        role: "user",
                        content: text
                    }
                ],
                model: "llama-3.3-70b-versatile" // Groq ning eng kuchli va aniq modeli
            })
        });

        const data = await response.json();

        if (data.choices && data.choices[0].message.content) {
            loadingMsg.innerText = data.choices[0].message.content;
        } else {
            loadingMsg.innerText = "❌ Groq API dan javob olishda xatolik yuz berdi.";
        }

    } catch (err) {
        loadingMsg.innerText = "❌ Ulanishda xatolik yuz berdi. Internetni va API kalitni tekshiring.";
    }
}

function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}
</script>

</body>
</html>
